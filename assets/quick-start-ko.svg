<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#081019"/><text x="48" y="62" fill="#f7fbff" font-size="34" font-family="Segoe UI,Malgun Gothic" font-weight="700">CC69 Threads Manager｜빠른 시작</text><text x="48" y="94" fill="#8fb4d8" font-size="18" font-family="Segoe UI,Malgun Gothic">로그인 → 빠른 검사 → 결과 확인 → 선택 후 언팔로우</text><rect x="48" y="126" width="1104" height="70" rx="14" fill="#101a26" stroke="#2e4965"/><text x="72" y="164" fill="#ffffff" font-size="24" font-family="Segoe UI" font-weight="700">CC69 Threads Manager</text><rect x="930" y="141" width="184" height="40" rx="10" fill="#14263a" stroke="#3475a8"/><text x="978" y="167" fill="#a9dcff" font-size="15" font-family="Malgun Gothic">한국어 ▾</text><rect x="48" y="208" width="1104" height="48" rx="10" fill="#0f1722" stroke="#29425b"/><circle cx="75" cy="232" r="7" fill="#58b1ff"/><text x="94" y="238" fill="#b8c9da" font-size="15" font-family="Malgun Gothic">Threads 계정:</text><text x="214" y="238" fill="#8fd2ff" font-size="15" font-family="Malgun Gothic" font-weight="700">로그인 확인 전</text><text x="1000" y="238" fill="#dce8f4" font-size="15" font-family="Malgun Gothic">언어</text><rect x="48" y="270" width="208" height="84" rx="12" fill="#111a25" stroke="#213247"/><rect x="268" y="270" width="208" height="84" rx="12" fill="#111a25" stroke="#213247"/><rect x="488" y="270" width="208" height="84" rx="12" fill="#111a25" stroke="#213247"/><rect x="708" y="270" width="208" height="84" rx="12" fill="#111a25" stroke="#213247"/><rect x="928" y="270" width="224" height="84" rx="12" fill="#111a25" stroke="#213247"/><text x="66" y="299" fill="#a5b5c6" font-size="14" font-family="Malgun Gothic">팔로잉</text><text x="66" y="337" fill="#59a8ff" font-size="30" font-family="Segoe UI" font-weight="700">0</text><text x="286" y="299" fill="#a5b5c6" font-size="14" font-family="Malgun Gothic">팔로워</text><text x="286" y="337" fill="#a2c8ff" font-size="30" font-family="Segoe UI" font-weight="700">0</text><text x="506" y="299" fill="#a5b5c6" font-size="14" font-family="Malgun Gothic">상대 미맞팔</text><text x="506" y="337" fill="#f0a33c" font-size="30" font-family="Segoe UI" font-weight="700">0</text><text x="726" y="299" fill="#a5b5c6" font-size="14" font-family="Malgun Gothic">내 미맞팔</text><text x="726" y="337" fill="#ff7168" font-size="30" font-family="Segoe UI" font-weight="700">0</text><text x="946" y="299" fill="#a5b5c6" font-size="14" font-family="Malgun Gothic">맞팔</text><text x="946" y="337" fill="#60d48a" font-size="30" font-family="Segoe UI" font-weight="700">0</text><rect x="48" y="368" width="1104" height="64" rx="12" fill="#10243a" stroke="#2b6a9b"/><circle cx="82" cy="400" r="20" fill="#2e8ceb"/><text x="76" y="407" fill="white" font-size="20" font-family="Segoe UI" font-weight="700">1</text><text x="118" y="394" fill="white" font-size="19" font-family="Malgun Gothic" font-weight="700">STEP 1 · 먼저 Threads에 로그인하세요</text><text x="118" y="418" fill="#d4e4f1" font-size="14" font-family="Malgun Gothic">로그인이 끝나면 다음 동작이 자동으로 '빠른 검사 시작'으로 바뀝니다.</text><rect x="48" y="446" width="230" height="42" rx="9" fill="#2169b7" stroke="#71b9ff"/><text x="105" y="473" fill="white" font-size="16" font-family="Malgun Gothic" font-weight="700">빠른 검사</text><rect x="290" y="446" width="280" height="42" rx="9" fill="#172331" stroke="#2d435a"/><text x="336" y="473" fill="#d3dfeb" font-size="16" font-family="Malgun Gothic" font-weight="700">다운로드 데이터 전체 검사</text><rect x="582" y="446" width="230" height="42" rx="9" fill="#172331" stroke="#2d435a"/><text x="628" y="473" fill="#d3dfeb" font-size="16" font-family="Malgun Gothic" font-weight="700">맞팔 센터｜베타</text><rect x="48" y="506" width="242" height="48" rx="9" fill="#0d75d8" stroke="#67b8ff" stroke-width="2"/><text x="72" y="537" fill="white" font-size="16" font-family="Malgun Gothic" font-weight="700">✓ 1. Threads 로그인 확인</text><rect x="304" y="506" width="242" height="48" rx="9" fill="#10161d" stroke="#344b62"/><text x="342" y="537" fill="#8494a6" font-size="16" font-family="Malgun Gothic" font-weight="700">▶ 2. 빠른 검사 시작</text><rect x="48" y="574" width="1104" height="46" rx="9" fill="#0f161f" stroke="#263a4f"/><text x="70" y="603" fill="#c3d3e3" font-size="15" font-family="Malgun Gothic">검사 후 결과 표가 메인 작업 영역이 되며 창을 키우면 추가 공간이 결과 목록에 우선 배정됩니다.</text></svg>