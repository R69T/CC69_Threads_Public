<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="24" fill="#07111d"/><rect x="34" y="34" width="1132" height="452" rx="20" fill="#0d1b2a" stroke="#2f81f7" stroke-width="2"/><text x="70" y="105" fill="#fff" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="42" font-weight="700">Windows의 PC 보호</text><text x="70" y="155" fill="#b7c9df" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="23">Microsoft Defender SmartScreen은 게시자를 확인할 수 없는 앱의 첫 실행을 차단할 수 있습니다.</text><rect x="70" y="205" width="270" height="62" rx="10" fill="#17324d" stroke="#58a6ff"/><text x="205" y="247" text-anchor="middle" fill="#fff" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="26" font-weight="700">1　추가 정보</text><text x="370" y="245" fill="#58a6ff" font-family="Segoe UI,sans-serif" font-size="34">→</text><rect x="430" y="205" width="270" height="62" rx="10" fill="#1f6feb"/><text x="565" y="247" text-anchor="middle" fill="#fff" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="26" font-weight="700">2　실행</text><rect x="70" y="315" width="1060" height="120" rx="14" fill="#101d2b" stroke="#d29922"/><text x="100" y="360" fill="#f2cc60" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="27" font-weight="700">중요: SmartScreen 경고가 Windows에서 바이러스를 탐지했다는 뜻은 아닙니다.</text><text x="100" y="405" fill="#dbe8f6" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="22">CC69는 상용 Windows 코드 서명 인증서로 서명되지 않아 Windows가 서명/평판 정보로 게시자를 확인할 수 없습니다.</text></svg>