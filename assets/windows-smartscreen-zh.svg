<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="24" fill="#07111d"/><rect x="34" y="34" width="1132" height="452" rx="20" fill="#0d1b2a" stroke="#2f81f7" stroke-width="2"/><text x="70" y="105" fill="#fff" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="42" font-weight="700">Windows 已保護您的電腦</text><text x="70" y="155" fill="#b7c9df" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="24">Microsoft Defender SmartScreen 可能會阻止未知發行者的應用程式首次執行。</text><rect x="70" y="205" width="270" height="62" rx="10" fill="#17324d" stroke="#58a6ff"/><text x="205" y="247" text-anchor="middle" fill="#fff" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="26" font-weight="700">1　其他資訊</text><text x="370" y="245" fill="#58a6ff" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="34">→</text><rect x="430" y="205" width="270" height="62" rx="10" fill="#1f6feb"/><text x="565" y="247" text-anchor="middle" fill="#fff" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="26" font-weight="700">2　仍要執行</text><rect x="70" y="315" width="1060" height="120" rx="14" fill="#101d2b" stroke="#d29922"/><text x="100" y="360" fill="#f2cc60" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="28" font-weight="700">重點：SmartScreen 警告 ≠ Windows 已偵測到病毒</text><text x="100" y="405" fill="#dbe8f6" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="23">CC69 尚未使用商業 Windows Code Signing 憑證，因此 Windows 無法用已知簽章／聲譽驗證發行者。</text></svg>