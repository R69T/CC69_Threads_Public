name: Connect localized SmartScreen screenshots

on:
  push:
    paths:
      - '.github/workflows/import-smartscreen-images.yml'

permissions:
  contents: write

jobs:
  connect-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect each language page to its real screenshot
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#assets/windows-smartscreen-real.png#assets/windows-smartscreen-zh.png#g' README.md
          sed -i 's#assets/windows-smartscreen-real.png#assets/windows-smartscreen-en.png#g' README.en.md
          sed -i 's#assets/windows-smartscreen-real.png#assets/windows-smartscreen-ja.png#g' README.ja.md
          sed -i 's#assets/windows-smartscreen-real.png#assets/windows-smartscreen-ko.png#g' README.ko.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md README.ja.md README.ko.md
          git rm .github/workflows/import-smartscreen-images.yml
          git commit -m 'Use real localized SmartScreen screenshots in all READMEs [skip ci]'
          git push
